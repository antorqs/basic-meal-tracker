<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Fuel | Meal tracker</title><script src="https://cdn.tailwindcss.com"></script><script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script><style>body{background:#f7f7f4}input,select{outline:none}input:focus,select:focus{box-shadow:0 0 0 3px #d9f99e}</style></head>
<body class="text-slate-900" x-data="tracker()" x-init="init()" x-cloak><main class="mx-auto max-w-xl px-4 pb-12">
<header class="flex items-center justify-between py-6"><div><p class="text-xs font-bold uppercase tracking-[.2em] text-lime-700">Daily fuel</p><h1 class="text-3xl font-black tracking-tight">Eat well, simply.</h1></div><button @click="showSettings=!showSettings" class="rounded-full bg-white px-3 py-2 shadow-sm">⚙️</button></header>
<section class="mb-5 flex gap-2 rounded-2xl bg-slate-900 p-1.5"><template x-for="u in users"><button @click="userId=u.id;load()" class="flex-1 rounded-xl px-3 py-2 text-sm font-bold" :class="userId===u.id?'bg-lime-300':'text-slate-400'" x-text="u.name"></button></template></section>
<section class="mb-5 flex items-center justify-between"><button @click="shift(-1)" class="rounded-xl bg-white px-3 py-2 shadow-sm">←</button><input type="date" x-model="selectedDate" @change="load()" class="rounded-xl border-0 bg-white px-3 py-2 font-bold shadow-sm"><button @click="shift(1)" class="rounded-xl bg-white px-3 py-2 shadow-sm">→</button></section>
<section class="mb-6 grid grid-cols-2 gap-3"><template x-for="metric in metrics"><div class="rounded-2xl bg-white p-4 shadow-sm"><div class="mb-3 flex justify-between text-xs font-bold uppercase tracking-wide text-slate-500"><span x-text="metric.label"></span><span x-text="Math.round(consumed[metric.key])+' / '+metric.target"></span></div><div class="mb-2 h-2 rounded-full bg-slate-100"><div class="h-2 rounded-full" :class="metric.key==='calories' && consumed[metric.key]>metric.target?'bg-red-500':'bg-lime-400'" :style="`width:${Math.min(100,consumed[metric.key]/metric.target*100)}%`"></div></div><p class="text-xl font-black"><span x-text="Math.round(remaining[metric.key])"></span> <small class="text-sm font-medium text-slate-500">left</small></p></div></template></section>
<div class="mb-3 flex items-center justify-between"><h2 class="text-lg font-black">Today’s meals</h2><button @click="openAdd()" class="rounded-xl bg-lime-300 px-4 py-2 text-sm font-black shadow-sm">+ Add meal</button></div>
<template x-if="!logs.length"><div class="rounded-2xl border-2 border-dashed border-slate-200 bg-white p-8 text-center"><p class="text-3xl">🥗</p><p class="mt-2 font-bold">Nothing logged yet</p><p class="text-sm text-slate-500">Add your first meal to get started.</p></div></template>
<div class="space-y-5"><template x-for="group in groupedLogs()" :key="group.type"><section><h3 class="mb-2 text-xs font-black uppercase tracking-[.2em] text-slate-500" x-text="group.type"></h3><div class="space-y-3"><template x-for="log in group.logs" :key="log.id"><article class="rounded-2xl bg-white p-4 shadow-sm"><div class="flex items-start justify-between"><div><p class="mt-1 font-bold" x-text="log.items.map(i=>i.ingredient_name).join(' · ')"></p></div><div class="flex gap-2"><button @click="editLog(log)" class="text-sm font-bold text-lime-700">Edit</button><button @click="remove(log.id)" class="text-lg text-slate-300">×</button></div></div><div class="mt-3 flex gap-4 text-sm text-slate-500"><span><b class="text-slate-900" x-text="Math.round(log.total_calories)"></b> kcal</span><span><b class="text-slate-900" x-text="Math.round(log.total_protein)"></b>g protein</span><button @click="duplicate(log.id)" class="ml-auto font-bold text-lime-700">Copy to <span x-text="otherUser().name"></span></button></div></article></template></div></section></template></div>
<section x-show="showSettings" class="mt-8 space-y-5 rounded-2xl bg-white p-5 shadow-sm"><div><h2 class="mb-3 text-lg font-black">Profile & targets</h2><div class="grid grid-cols-2 gap-2"><input x-model="profile.name" class="rounded-xl bg-slate-100 p-3" placeholder="Name"><input type="number" x-model.number="profile.target_calories" class="rounded-xl bg-slate-100 p-3" placeholder="Calories"><input type="number" x-model.number="profile.target_protein" class="rounded-xl bg-slate-100 p-3" placeholder="Protein (g)"><button @click="saveProfile()" class="rounded-xl bg-slate-900 p-3 font-bold text-white">Save profile</button></div><p class="mt-2 text-xs text-slate-500">Targets apply from the selected date: <span x-text="selectedDate"></span>.</p></div><div><h2 class="mb-3 text-lg font-black">Ingredient library</h2><input x-model="ingredientSearch" class="mb-3 w-full rounded-xl bg-slate-100 p-3" placeholder="Search ingredients..."><div class="space-y-2"><template x-for="i in filteredIngredients()" :key="i.id"><div class="flex items-center justify-between border-b border-slate-100 py-2 text-sm"><div><span class="font-medium" x-text="i.name"></span><span class="ml-2 text-slate-400" x-text="Math.round(i.calories_per_100g)+' kcal · '+i.protein_per_100g+'g / 100g'"></span></div><button @click="editIngredient(i)" class="font-bold text-lime-700">Edit</button></div></template></div></div></section></main>
<div x-show="showModal" class="fixed inset-0 z-10 flex items-end justify-center bg-slate-900/40 p-3 sm:items-center"><section class="max-h-[90vh] w-full max-w-xl overflow-auto rounded-3xl bg-white p-5"><div class="mb-5 flex items-center justify-between"><h2 class="text-2xl font-black" x-text="editingId?'Edit meal':'Log a meal'"></h2><button @click="showModal=false" class="text-2xl text-slate-400">×</button></div><div class="mb-4 grid grid-cols-2 gap-3"><label class="text-xs font-bold uppercase text-slate-500">Meal type<select x-model="mealType" class="mt-1 w-full rounded-xl bg-slate-100 p-3 text-sm"><option>Breakfast</option><option>Lunch</option><option>Dinner</option><option>Snack</option></select></label><label class="text-xs font-bold uppercase text-slate-500">Quick load<select @change="loadRecipe($event.target.value)" class="mt-1 w-full rounded-xl bg-slate-100 p-3 text-sm"><option value="">Choose recipe...</option><template x-for="m in meals"><option :value="m.id" x-text="m.name"></option></template></select></label></div><div class="space-y-3"><template x-for="(item,index) in items" :key="index"><div class="grid grid-cols-[1fr_80px] gap-2 rounded-2xl bg-slate-50 p-3"><div class="relative"><input x-model="item.name" @input="item.base=null;suggest(item.name,index)" placeholder="Ingredient" class="w-full rounded-lg bg-white p-2 font-medium"><div x-show="suggestions[index]?.length" class="absolute left-0 right-0 top-10 z-20 rounded-lg bg-white p-1 shadow-lg"><template x-for="s in suggestions[index]" :key="s.id"><button @click="pick(s,index)" class="block w-full rounded p-2 text-left text-sm hover:bg-lime-100" x-text="s.name"></button></template></div></div><input type="number" min="1" x-model.number="item.weight" @input="calculate(item)" class="rounded-lg bg-white p-2"><template x-if="!item.base"><div class="col-span-2 grid grid-cols-2 gap-2"><input type="number" min="0" x-model.number="item.calories_per_100g" @input="calculate(item)" placeholder="Calories / 100g" class="rounded-lg bg-white p-2 text-sm"><input type="number" min="0" x-model.number="item.protein_per_100g" @input="calculate(item)" placeholder="Protein / 100g" class="rounded-lg bg-white p-2 text-sm"></div></template><div class="col-span-2 flex justify-between text-xs text-slate-500"><span><b x-text="Math.round(item.calories)"></b> kcal · <b x-text="item.protein.toFixed(1)"></b>g protein</span><button @click="items.splice(index,1)" class="font-bold text-red-400">Remove</button></div></div></template></div><button @click="items.push(blank())" class="mt-4 w-full rounded-xl border-2 border-dashed border-slate-200 py-3 text-sm font-bold">+ Add ingredient</button><div class="mt-5 grid grid-cols-2 gap-2"><button @click="saveMeal()" class="rounded-xl bg-slate-900 px-3 py-3 text-sm font-black text-white" x-text="editingId?'Update meal':'Save meal'"></button><button @click="saveRecipe()" class="rounded-xl bg-lime-300 px-3 py-3 text-sm font-black">Save as recipe</button></div></section></div>
<div x-show="ingredientEditor" class="fixed inset-0 z-20 flex items-center justify-center bg-slate-900/40 p-3"><section class="w-full max-w-sm rounded-3xl bg-white p-5"><h2 class="mb-4 text-xl font-black">Edit ingredient</h2><div class="space-y-2"><input x-model="ingredientForm.name" class="w-full rounded-xl bg-slate-100 p-3" placeholder="Name"><input type="number" x-model.number="ingredientForm.calories_per_100g" class="w-full rounded-xl bg-slate-100 p-3" placeholder="Calories / 100g"><input type="number" x-model.number="ingredientForm.protein_per_100g" class="w-full rounded-xl bg-slate-100 p-3" placeholder="Protein / 100g"></div><div class="mt-4 flex gap-2"><button @click="ingredientEditor=false" class="flex-1 rounded-xl bg-slate-100 p-3 font-bold">Cancel</button><button @click="saveIngredient()" class="flex-1 rounded-xl bg-lime-300 p-3 font-bold">Save</button></div></section></div>
<script>
function tracker(){return {users:[],ingredients:[],meals:[],ingredientSearch:'',userId:1,selectedDate:new Date().toISOString().slice(0,10),consumed:{calories:0,protein:0},remaining:{calories:0,protein:0},logs:[],items:[],suggestions:{},showModal:false,showSettings:false,ingredientEditor:false,editingId:null,mealType:'Breakfast',metrics:[],profile:{},ingredientForm:{},async init(){await Promise.all([this.get('/api/users').then(x=>this.users=x),this.get('/api/ingredients').then(x=>this.ingredients=x),this.get('/api/meals').then(x=>this.meals=x)]);this.load()},async get(url){return fetch(url).then(r=>r.json())},async load(){let s=await this.get(`/api/summary?user_id=${this.userId}&date=${this.selectedDate}`);this.consumed=s.consumed;this.remaining=s.remaining;this.logs=s.logs;this.profile={name:s.user.name,target_calories:s.user.target_calories,target_protein:s.user.target_protein};this.metrics=[{key:'calories',label:'Calories',target:s.user.target_calories},{key:'protein',label:'Protein',target:s.user.target_protein}]},groupedLogs(){return [...new Set(this.logs.map(x=>x.meal_type))].map(type=>({type,logs:this.logs.filter(x=>x.meal_type===type)}))},filteredIngredients(){return [...this.ingredients].sort((a,b)=>a.name.localeCompare(b.name)).filter(i=>i.name.toLowerCase().includes(this.ingredientSearch.toLowerCase()))},otherUser(){return this.users.find(u=>u.id!==this.userId)||{}},shift(n){let d=new Date(this.selectedDate+'T12:00:00');d.setDate(d.getDate()+n);this.selectedDate=d.toISOString().slice(0,10);this.load()},blank(){return {name:'',weight:100,calories:0,protein:0,calories_per_100g:0,protein_per_100g:0,base:null}},openAdd(){this.editingId=null;this.items=[this.blank()];this.showModal=true},editLog(log){this.editingId=log.id;this.mealType=log.meal_type;this.items=log.items.map(x=>({name:x.ingredient_name,weight:x.weight,calories:x.calories,protein:x.protein,base:this.ingredients.find(i=>i.name===x.ingredient_name),calories_per_100g:0,protein_per_100g:0}));this.showModal=true},suggest(q,i){this.suggestions[i]=q.length<2?[]:this.ingredients.filter(x=>x.name.toLowerCase().includes(q.toLowerCase())).slice(0,5)},pick(s,i){this.items[i].name=s.name;this.items[i].base=s;this.items[i].calories_per_100g=s.calories_per_100g;this.items[i].protein_per_100g=s.protein_per_100g;this.calculate(this.items[i]);this.suggestions[i]=[]},calculate(i){let c=i.base?i.base.calories_per_100g:i.calories_per_100g,p=i.base?i.base.protein_per_100g:i.protein_per_100g;i.calories=c*i.weight/100;i.protein=p*i.weight/100},loadRecipe(id){let m=this.meals.find(x=>x.id==id);if(m)this.items=m.items.map(x=>{let b=this.ingredients.find(y=>y.name===x.name),i={...x,base:b,calories_per_100g:b?.calories_per_100g||0,protein_per_100g:b?.protein_per_100g||0,calories:0,protein:0};this.calculate(i);return i})},payload(){return {user_id:this.userId,date:this.selectedDate,meal_type:this.mealType,items:this.items.filter(x=>x.name&&x.weight).map(x=>({name:x.name,weight:x.weight,calories:x.calories,protein:x.protein,calories_per_100g:x.base?.calories_per_100g??x.calories_per_100g,protein_per_100g:x.base?.protein_per_100g??x.protein_per_100g}))}},async ensureIngredients(items){for(const item of items){let existing=this.ingredients.find(i=>i.name.toLowerCase()===item.name.toLowerCase()),c=item.calories_per_100g,p=item.protein_per_100g;if(!existing){let r=await fetch('/api/ingredients',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:item.name,calories_per_100g:c,protein_per_100g:p})});if(!r.ok)return false}else if(Math.abs(existing.calories_per_100g-c)>0.001||Math.abs(existing.protein_per_100g-p)>0.001){if(!confirm(`${item.name} already exists with different nutrition. Overwrite the master ingredient?`))return false;await fetch('/api/ingredients/'+existing.id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:existing.name,calories_per_100g:c,protein_per_100g:p})})}}this.ingredients=await this.get('/api/ingredients');return true},async saveMeal(){let p=this.payload();if(!p.items.length)return alert('Add an ingredient first');if(!await this.ensureIngredients(p.items))return;await fetch(this.editingId?`/api/logs/${this.editingId}`:'/api/logs',{method:this.editingId?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});this.showModal=false;await this.load()},async saveRecipe(){let name=prompt('Recipe name?');if(!name)return;let p=this.payload();if(!p.items.length)return alert('Add an ingredient first');if(!await this.ensureIngredients(p.items))return;let r=await fetch('/api/meals',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,items:p.items})});if(!r.ok)return alert((await r.json()).detail||'Could not save recipe');this.meals=await this.get('/api/meals');alert('Recipe saved')},async remove(id){if(confirm('Delete this meal?')){await fetch('/api/logs/'+id,{method:'DELETE'});this.load()}},async duplicate(id){await fetch(`/api/logs/${id}/duplicate?user_id=${this.otherUser().id}`,{method:'POST'});alert('Copied to '+this.otherUser().name)},async saveProfile(){await fetch(`/api/users/${this.userId}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({...this.profile,effective_date:this.selectedDate})});await this.load();alert('Profile saved')},editIngredient(i){this.ingredientForm={...i};this.ingredientEditor=true},async saveIngredient(){let p={name:this.ingredientForm.name,calories_per_100g:this.ingredientForm.calories_per_100g,protein_per_100g:this.ingredientForm.protein_per_100g};let r=await fetch('/api/ingredients/'+this.ingredientForm.id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});if(!r.ok)return alert((await r.json()).detail||'Could not save ingredient');this.ingredients=await this.get('/api/ingredients');this.ingredientEditor=false}}}
</script><style>[x-cloak]{display:none!important}</style></body></html>
